<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Listen to the full Harry Potter audiobook series online with persistent progress tracking and custom player controls.">
    <title>Harry Potter Full-cast Audiobook Collection</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: rgba(28, 28, 33, 0.85);
            --card-hover: rgba(39, 39, 47, 0.95);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Multi-color gradient */
            background: linear-gradient(-45deg, #0f0c20, #1a1b35, #121214, #27153b);
            background-size: 400% 400%;
            /* Smooth continuous animation */
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            background: rgba(18, 18, 20, 0.4);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* House Theme Picker */
        .house-picker {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .house-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s;
        }

        .house-dot:hover {
            transform: scale(1.2);
        }

        .house-dot.gryffindor { background: #740001; }
        .house-dot.slytherin { background: #1a472a; }
        .house-dot.ravenclaw { background: #0e1a40; }
        .house-dot.hufflepuff { background: #ecb939; }

        body.theme-gryffindor { --accent-color: #ae0001; --accent-hover: #740001; }
        body.theme-slytherin { --accent-color: #2a623d; --accent-hover: #1a472a; }
        body.theme-ravenclaw { --accent-color: #222f5b; --accent-hover: #0e1a40; }
        body.theme-hufflepuff { --accent-color: #f0c75e; --accent-hover: #ecb939; }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Continue Listening Resume Banner */
        .resume-banner {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resume-label {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .resume-info h4 {
            font-size: 1rem;
            margin: 0.2rem 0;
        }

        .resume-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .resume-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .resume-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Home Library Grid View */
        #home-view.active {
            display: grid;
        }
        #home-view {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .book-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-color);
        }

        .book-cover {
            width: 100%;
            height: 280px;
            background-color: #2b2b36;
            overflow: hidden;
            position: relative;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-info {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .book-info span {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 500;
        }

        /* Player View */
        #player-view {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        #player-view.active {
            display: block;
        }

        .back-btn {
            background: rgba(28, 28, 33, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: var(--card-hover);
        }

        .player-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .player-header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .player-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .player-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        audio {
            width: 100%;
            margin: 1.5rem 0;
            accent-color: var(--accent-color);
        }

        /* Extra Player Controls (Speed & Sleep Timer) */
        .player-controls-extra {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-controls-extra select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .chapter-list {
            margin-top: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .chapter-item {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            transition: background 0.2s, color 0.2s;
            margin-bottom: 0.25rem;
        }

        .chapter-item:hover {
            background-color: var(--card-hover);
            color: var(--text-main);
        }

        .chapter-item.active {
            background-color: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            background: rgba(18, 18, 20, 0.4);
        }

/* Mobile Optimization for iPhone, Android, and small screens */
        @media (max-width: 768px) {
            header {
                padding: 1.5rem 1rem 1rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            main {
                padding: 1rem 0.75rem;
            }

            #home-view {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }

            .book-cover {
                height: 220px; /* Balanced height for 2-column mobile view */
            }

            .book-info {
                padding: 0.75rem;
            }

            .book-info h3 {
                font-size: 0.9rem;
            }

            .player-card {
                padding: 1rem;
            }
}
    </style>
</head>

    <header>
        <h1>Harry Potter Audiobooks</h1>
        <p>Full Cast Audio Collection &bull; Special thanks to my patience</p>
        <div class="house-picker">
            <span class="house-dot gryffindor" title="Gryffindor" onclick="setHouseTheme('gryffindor')"></span>
            <span class="house-dot slytherin" title="Slytherin" onclick="setHouseTheme('slytherin')"></span>
            <span class="house-dot ravenclaw" title="Ravenclaw" onclick="setHouseTheme('ravenclaw')"></span>
            <span class="house-dot hufflepuff" title="Hufflepuff" onclick="setHouseTheme('hufflepuff')"></span>
        </div>
    </header>

    <main>
        <!-- RESUME BANNER -->
        <div id="resume-banner" class="resume-banner" style="display: none;">
            <div class="resume-info">
                <span class="resume-label">LAST LISTENED</span>
                <h4 id="resume-title">Book Title</h4>
                <p id="resume-chapter">Chapter Title</p>
            </div>
            <button class="resume-btn" onclick="resumePlayback()">&#9654; Resume</button>
        </div>
        
        <!-- HOME VIEW (Book Grid) -->
        <div id="home-view" class="active">
            <!-- Generated dynamically via JavaScript -->
        </div>

        <!-- PLAYER VIEW (Single Dynamic Player) -->
        <div id="player-view">
            <button class="back-btn" onclick="showHome()">&#8592; Back to Library</button>
            <div class="player-card">
                <div class="player-header">
                    <h2 id="current-book-title">Book Title</h2>
                    <p id="current-chapter-title">Select a chapter below</p>
                </div>
                
                <audio id="audio-player" controls preload="auto"></audio>

                <!-- Speed & Sleep Timer Controls -->
                <div class="player-controls-extra">
                    <div class="control-group">
                        <label for="speed-select">Speed:</label>
                        <select id="speed-select" onchange="changeSpeed(this.value)">
                            <option value="1">1x (Normal)</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="sleep-select">Sleep Timer:</label>
                        <select id="sleep-select" onchange="setSleepTimer(this.value)">
                            <option value="0">Off</option>
                            <option value="15">15 Minutes</option>
                            <option value="30">30 Minutes</option>
                            <option value="60">60 Minutes</option>
                            <option value="eoc">End of Chapter</option>
                        </select>
                    </div>
                </div>
                
                <div class="chapter-list" id="chapter-list-container">
                    <!-- Chapters populated dynamically -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Harry Potter Audio Player. Built with HTML5 &amp; JavaScript.</p>
    </footer>

        let currentBook = null;
        let currentChapterIndex = 0;
        const audioPlayer = document.getElementById('audio-player');
        let sleepTimerTimeout = null;

        // Render Home Grid
        function renderHome() {
            const homeView = document.getElementById('home-view');
            homeView.innerHTML = '';

            booksData.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.onclick = () => openBook(book.id);
                card.innerHTML = `
                    <div class="book-cover">
                        <img src="${book.coverImage}" alt="${book.title}">
                        </div>
                    </div>
                    <div class="book-info">
                        <h3>${book.title}</h3>
                        <span>Listen Now &rarr;</span>
                    </div>
                `;
                homeView.appendChild(card);
            });
        }

        // Open specific book player view
        function openBook(bookId, chapterIndex = null, startTime = null, autoplay = false) {
            currentBook = booksData.find(b => b.id === bookId);
            document.getElementById('current-book-title').textContent = currentBook.title;
            
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('player-view').classList.add('active');

            renderChapters();
            
            // Load progress from localStorage if available
            const targetChapter = chapterIndex !== null ? chapterIndex : (parseInt(localStorage.getItem(`hp_book_${bookId}_chapter`)) || 0);
            const targetTime = startTime !== null ? startTime : (parseFloat(localStorage.getItem(`hp_book_${bookId}_time`)) || 0);
            
            loadChapter(targetChapter, targetTime, autoplay);
        }

        // Return to home view
        function showHome() {
            audioPlayer.pause();
            document.getElementById('player-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
        }

        // Render chapters list for active book
        function renderChapters() {
            const container = document.getElementById('chapter-list-container');
            container.innerHTML = '';

            currentBook.chapters.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = `chapter-item ${index === currentChapterIndex ? 'active' : ''}`;
                item.innerHTML = `<span>${ch.title}</span>`;
                item.onclick = () => {
                    loadChapter(index, 0);
                    audioPlayer.play();
                };
                container.appendChild(item);
            });
        }

        // Load specific chapter and time
        function loadChapter(index, startTime = 0, autoplay = false) {
            currentChapterIndex = index;
            const chapter = currentBook.chapters[index];
            
            document.getElementById('current-chapter-title').textContent = chapter.title;
            
        audioPlayer.onloadedmetadata = () => {
                audioPlayer.currentTime = startTime;
                if (autoplay) {
                    audioPlayer.play().catch(err => console.log("Autoplay prevented:", err));
                }
            };

            audioPlayer.src = chapter.src;
            audioPlayer.load();

            // Highlight active chapter in list
            document.querySelectorAll('.chapter-item').forEach((el, idx) => {
                if (idx === index) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // Playback Speed Controller
        function changeSpeed(speed) {
            audioPlayer.playbackRate = parseFloat(speed);
            localStorage.setItem('hp_playback_speed', speed);
        }

        audioPlayer.onplay = () => {
            const savedSpeed = localStorage.getItem('hp_playback_speed') || 1;
            audioPlayer.playbackRate = parseFloat(savedSpeed);
            document.getElementById('speed-select').value = savedSpeed;
        };

        // Sleep Timer Controller
        function setSleepTimer(val) {
            if (sleepTimerTimeout) {
                clearTimeout(sleepTimerTimeout);
                sleepTimerTimeout = null;
            }

            if (val === '0') return;

            if (val === 'eoc') {
                audioPlayer.onended = () => {
                    audioPlayer.pause();
                    document.getElementById('sleep-select').value = '0';
                };
            } else {
                const minutes = parseInt(val);
                const ms = minutes * 60 * 1000;
                sleepTimerTimeout = setTimeout(() => {
                    audioPlayer.pause();
                    document.getElementById('sleep-select').value = '0';
                    alert('Sleep timer reached. Audio paused.');
                }, ms);
            }
        }

        // House Theme Picker
        function setHouseTheme(house) {
            document.body.className = '';
            if (house) {
                document.body.classList.add(`theme-${house}`);
                localStorage.setItem('hp_house_theme', house);
            }
        }

        const savedHouse = localStorage.getItem('hp_house_theme');
        if (savedHouse) {
            setHouseTheme(savedHouse);
        }

        // Resume Banner Management
        function checkResumeBanner() {
            const lastBookId = localStorage.getItem('hp_last_book_id');
            const lastChapterIdx = localStorage.getItem('hp_last_chapter_idx');

            if (lastBookId !== null && lastChapterIdx !== null) {
                const book = booksData.find(b => b.id === parseInt(lastBookId));
                if (book && book.chapters[lastChapterIdx]) {
                    document.getElementById('resume-title').textContent = book.title;
                    document.getElementById('resume-chapter').textContent = book.chapters[lastChapterIdx].title;
                    document.getElementById('resume-banner').style.display = 'flex';
                    return;
                }
            }
            document.getElementById('resume-banner').style.display = 'none';
        }

        function resumePlayback() {
            const lastBookId = localStorage.getItem('hp_last_book_id');
            const lastChapterIdx = localStorage.getItem('hp_last_chapter_idx');

            if (lastBookId === null || lastChapterIdx === null) {
                checkResumeBanner();
                return;
            }

            const savedTime = localStorage.getItem(`hp_book_${lastBookId}_time`) || 0;

            openBook(
                parseInt(lastBookId),
                parseInt(lastChapterIdx),
                parseFloat(savedTime),
                true
            );
        }



        // Save progress to localStorage automatically
        audioPlayer.ontimeupdate = () => {
            if (currentBook) {
                localStorage.setItem(`hp_book_${currentBook.id}_chapter`, currentChapterIndex);
                localStorage.setItem(`hp_book_${currentBook.id}_time`, audioPlayer.currentTime);
                localStorage.setItem('hp_last_book_id', currentBook.id);
                localStorage.setItem('hp_last_chapter_idx', currentChapterIndex);
            }
        };

        // Initialize on load
        renderHome();
        checkResumeBanner(); 
    </script>
</body>
</html>
